deployment:
  replicas: 2
ingressClass:
  enabled: true
  name: traefik
  isDefaultClass: false
providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik
    allowCrossNamespace: false
    defaultTLSResourcesNamespace: traefik
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
ingressRoute:
  dashboard:
    enabled: false
tlsStore:
  default:
    defaultCertificate:
      secretName: testlab-wildcard-tls
service:
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Cluster
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
          topologyKey: kubernetes.io/hostname